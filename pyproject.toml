[project]
name = "questboard-pipeline"
version = "1.0.0"
description = "QuestBoard opportunity collection and normalization pipeline"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
questboard = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"

