name: Collect data and deploy

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '43 */6 * * *'
    - cron: '11 18 * * *'
  workflow_dispatch:
    inputs:
      schedule:
        description: 수집 그룹
        required: true
        type: choice
        default: all
        options: [fast, slow, all]
      source:
        description: 특정 출처 ID만 실행(선택)
        required: false
        type: string
      limit:
        description: 출처별 최대 수집 건수
        required: true
        default: '100'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: questboard-pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      MANUAL_SCHEDULE: ${{ inputs.schedule }}
      MANUAL_SOURCE: ${{ inputs.source }}
      MANUAL_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pipeline
        run: python -m pip install -e .
      - name: Choose collection group
        id: mode
        shell: bash
        run: |
          mode="${MANUAL_SCHEDULE:-fast}"
          if [[ "$EVENT_SCHEDULE" == "43 */6 * * *" ]]; then mode=slow; fi
          if [[ "$EVENT_SCHEDULE" == "11 18 * * *" ]]; then mode=all; fi
          limit="${MANUAL_LIMIT:-100}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
      - name: Collect opportunities
        shell: bash
        run: |
          args=(--schedule "${{ steps.mode.outputs.mode }}" --limit "${{ steps.mode.outputs.limit }}")
          if [[ -n "$MANUAL_SOURCE" ]]; then args+=(--source "$MANUAL_SOURCE"); fi
          python -m pipeline.cli "${args[@]}"
      - name: Validate generated data
        run: python -m pipeline.validate
      - name: Commit changed data
        shell: bash
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Generated data did not change."
          else
            git config user.name "questboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh ${{ steps.mode.outputs.mode }} sources"
            git push
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
