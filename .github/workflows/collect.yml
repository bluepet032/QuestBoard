name: Collect data and deploy

on:
  schedule:
    # Once a day at 03:11 KST (18:11 UTC). Use "Run workflow" for a manual refresh.
    - cron: '11 18 * * *'
  workflow_dispatch:
    inputs:
      schedule:
        description: 수집 그룹 (all=전체, fast/slow=출처 일부만)
        required: true
        type: choice
        default: all
        options: [fast, slow, all]
      source:
        description: 특정 출처 ID만 실행(선택)
        required: false
        type: string
      limit:
        description: 출처별 최대 수집 건수
        required: true
        default: '150'
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: questboard-pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MANUAL_SCHEDULE: ${{ inputs.schedule }}
      MANUAL_SOURCE: ${{ inputs.source }}
      MANUAL_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pipeline
        run: python -m pip install -e .
      - name: Choose collection group
        id: mode
        shell: bash
        run: |
          # The daily schedule always refreshes every source; manual runs may pick a group.
          mode="${MANUAL_SCHEDULE:-all}"
          limit="${MANUAL_LIMIT:-150}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
      - name: Collect opportunities
        shell: bash
        run: |
          args=(--schedule "${{ steps.mode.outputs.mode }}" --limit "${{ steps.mode.outputs.limit }}")
          if [[ -n "$MANUAL_SOURCE" ]]; then args+=(--source "$MANUAL_SOURCE"); fi
          python -m pipeline.cli "${args[@]}"
      - name: Validate generated data
        run: python -m pipeline.validate
      - name: Report failing or shrinking sources
        # Alerting must never block the data commit or the deploy.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alert_args=()
          # Partial manual runs collect fewer items on purpose; only check drops on full runs.
          if [[ -n "$MANUAL_SOURCE" || "${{ steps.mode.outputs.mode }}" != "all" || "${{ steps.mode.outputs.limit }}" != "150" ]]; then
            alert_args+=(--skip-drops)
          fi
          alerts="$(python -m pipeline.alerts "${alert_args[@]}")"
          open_titles="$(gh issue list --state open --limit 200 --json title,number)"
          echo "$alerts" | jq -c '.failing[]' | while read -r item; do
            title="$(jq -r '.title' <<<"$item")"
            if jq -e --arg title "$title" 'any(.[]; .title == $title)' <<<"$open_titles" >/dev/null; then
              echo "Issue already open: $title"
            else
              gh issue create --title "$title" --body "$(jq -r '.body' <<<"$item")"
            fi
          done
          echo "$alerts" | jq -c '.recovered[]' | while read -r item; do
            title="$(jq -r '.title' <<<"$item")"
            jq -r --arg title "$title" '.[] | select(.title == $title) | .number' <<<"$open_titles" | while read -r number; do
              gh issue close "$number" --comment "출처 상태가 회복되어 자동으로 닫습니다."
            done
          done
      - name: Commit changed data
        shell: bash
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Generated data did not change."
          else
            git config user.name "questboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh ${{ steps.mode.outputs.mode }} sources"
            # main may have moved while collecting; replay the data commit on top and retry.
            for attempt in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt ${attempt} failed; retrying."
              sleep $((attempt * 10))
            done
            echo "::error::Could not push generated data after 3 attempts."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
